name: Java CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - broker_label: kafka39
            compose_file: docker/docker-compose.yml
          - broker_label: kafka40
            compose_file: docker/docker-compose.kafka4.yml
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: build (${{ matrix.broker_label }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Start docker compose for integration tests
        run: docker compose -f "${{ matrix.compose_file }}" up -d

      - name: Build with Gradle
        run: ./gradlew --info build

      - name: Upload build artifact
        if: matrix.broker_label == 'kafka40'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kafka-gitops-${{ matrix.broker_label }}.jar
          path: build/libs/kafka-gitops-*-all.jar

      - name: Stop docker compose
        if: always()
        run: docker compose -f "${{ matrix.compose_file }}" down -v
